<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Calculator</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f6f9; color: #333; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        input { width: 100%; padding: 12px; box-sizing: border-box; font-size: 18px; border-radius: 6px; border: 1px solid #ccc; margin-top: 8px; margin-bottom: 20px; }
        .row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; }
        .val { font-weight: bold; color: #2c3e50; }
    </style>
</head>
<body>
    <div class="card">
        <label style="font-weight: bold;">Enter Total Salary:</label>
        <input type="number" id="salary" value="29400" oninput="calculate()">
        
        <div class="row"><span>Unavoidable expense (27.6%)</span><span class="val" id="c1">0</span></div>
        <div class="row"><span>Guilt free fun (22.4%)</span><span class="val" id="c2">0</span></div>
        <div class="row"><span>Nifty 50 MF (17.0%)</span><span class="val" id="c3">0</span></div>
        <div class="row"><span>Mid cap MF (10.2%)</span><span class="val" id="c4">0</span></div>
        <div class="row"><span>PPF Investment (9.2%)</span><span class="val" id="c5">0</span></div>
        <div class="row"><span>High risk pool (13.6%)</span><span class="val" id="c6">0</span></div>
    </div>

    <script>
        function calculate() {
            var salary = parseFloat(document.getElementById('salary').value) || 0;
            document.getElementById('c1').innerText = (salary * 0.2755102).toFixed(0);
            document.getElementById('c2').innerText = (salary * 0.2244898).toFixed(0);
            document.getElementById('c3').innerText = (salary * 0.1700680).toFixed(0);
            document.getElementById('c4').innerText = (salary * 0.1020408).toFixed(0);
            document.getElementById('c5').innerText = (salary * 0.0918367).toFixed(0);
            document.getElementById('c6').innerText = (salary * 0.1360544).toFixed(0);
        }
        window.onload = calculate;
    </script>
</body>
</html>
